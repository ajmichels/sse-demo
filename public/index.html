<!doctype html>
<html lang="en">
    <head>
        <title>SSE Demo</title>
    </head>
    <body>
        <h1>SSE Demo</h1>
        <p>The point of this script is to test out Server-sent Events (SSE) compared to REST API responses.</p>
        <form method="get" action="/">
            <select name="mode"></select>
            <button type="submit">Load</button>
        </form>
        <div id="target">
            <p id="msg" style="display: none;">Waiting on data!</p>
        </div>
        <script type="module">
            import { MODE, buildUI, runSolution } from '/js/app.js';

            const mode = new URL(window.location).searchParams.get('mode');
            const { msg, list } = buildUI(document, mode);

            if (mode && !MODE.has(mode)) alert('Invalid mode!');
            if (MODE.has(mode)) await runSolution(document, mode, msg, list);
        </script>
    </body>
</html>
